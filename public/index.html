<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fafafa">
    <meta name="color-scheme" content="light">
    <title>QRDrop | Envía fotos y archivos escaneando un QR</title>
    <meta name="description" content="Abre esta página, escanea el QR con tu celular y envía fotos o archivos directo, sin cables ni apps.">
    <meta name="author" content="mxnueel">
    <link rel="icon" sizes="96x96" href="images/favicon-96x96.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/qrdrop.css">
</head>
<body>
    <div class="wrap">
        <div class="wordmark"><span class="sq"></span>QRDrop</div>

        <div>
            <h1>Escanea<br>para enviar</h1>
            <p class="subtitle">Abre la cámara de tu celular, escanea el código y manda fotos o archivos directo a esta pantalla.</p>
        </div>

        <div class="qr-block">
            <div class="qr-frame" id="qr-frame"></div>
            <hr class="room-code-rule">
            <span class="room-code" id="room-code">••••••</span>
            <div class="status-row">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Conectando…</span>
            </div>
        </div>

        <div>
            <div class="section-head">
                <h2>Archivos recibidos</h2>
                <button class="btn-flat" id="btn-download-all" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                    Descargar todo
                </button>
            </div>
            <p class="empty-hint" id="empty-hint">Aún no llega nada.</p>
            <div id="file-list"></div>
        </div>

        <p class="footer-note">Transferencia directa entre dispositivos (P2P), sin pasar por ningún servidor.</p>
    </div>

    <script src="scripts/util.js"></script>
    <script src="scripts/browser-tabs-connector.js"></script>
    <script src="scripts/persistent-storage.js"></script>
    <script src="scripts/localization.js"></script>
    <script src="scripts/network.js"></script>
    <script src="scripts/libs/qr-code.min.js"></script>
    <script src="scripts/libs/zip.min.js"></script>
    <script src="scripts/app-pc.js"></script>
</body>
</html>
