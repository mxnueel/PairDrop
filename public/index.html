<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0e14">
    <meta name="color-scheme" content="dark">
    <title>QRDrop | Envía fotos y archivos escaneando un QR</title>
    <meta name="description" content="Abre esta página, escanea el QR con tu celular y envía fotos o archivos directo, sin cables ni apps.">
    <meta name="author" content="mxnueel">
    <link rel="icon" sizes="96x96" href="images/favicon-96x96.png">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="styles/qrdrop.css">
</head>
<body>
    <div class="wrap">
        <div class="brand"><span class="dot"></span>QRDrop</div>
        <h1>Escanea para enviar</h1>
        <p class="subtitle">Abre la cámara de tu celular, escanea el código y envía fotos o archivos directo a esta pantalla.</p>

        <div class="card">
            <div class="qr-frame" id="qr-frame"></div>
            <div class="room-code" id="room-code">••••••</div>
            <div class="status-row">
                <span class="status-dot" id="status-dot"></span>
                <span id="status-text">Conectando…</span>
            </div>
        </div>

        <div class="card files-panel">
            <h2>Archivos recibidos</h2>
            <p class="empty-hint" id="empty-hint">Aún no llega nada.</p>
            <div id="file-list"></div>
        </div>

        <p class="footer-note">Transferencia directa entre dispositivos (P2P), sin pasar por ningún servidor.</p>
    </div>

    <script src="scripts/util.js"></script>
    <script src="scripts/browser-tabs-connector.js"></script>
    <script src="scripts/persistent-storage.js"></script>
    <script src="scripts/localization.js"></script>
    <script src="scripts/network.js"></script>
    <script src="scripts/libs/qr-code.min.js"></script>
    <script src="scripts/app-pc.js"></script>
</body>
</html>
