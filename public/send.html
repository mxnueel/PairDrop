<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d0e14">
    <meta name="color-scheme" content="dark">
    <title>QRDrop | Enviar</title>
    <meta name="description" content="Elige fotos o archivos y envíalos directo a tu PC.">
    <link rel="icon" sizes="96x96" href="images/favicon-96x96.png">
    <link rel="stylesheet" href="styles/qrdrop.css">
</head>
<body>
    <div class="wrap">
        <div class="brand"><span class="dot"></span>QRDrop</div>

        <div id="choose-screen" style="display:flex; flex-direction:column; align-items:center; gap:1.5rem; width:100%;">
            <h1>¿Qué quieres enviar?</h1>
            <p class="subtitle">Se manda directo a la pantalla que escaneaste, sin subir a ningún servidor.</p>

            <div class="card">
                <div class="action-grid">
                    <button class="action-btn photos" id="btn-photos" disabled>
                        <span class="emoji">📷</span> Fotos
                    </button>
                    <button class="action-btn files" id="btn-files" disabled>
                        <span class="emoji">📁</span> Archivos
                    </button>
                </div>

                <input type="file" id="input-photos" accept="image/*,video/*" multiple>
                <input type="file" id="input-files" multiple>

                <div class="progress-track" id="progress-track">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <div class="feedback info" id="feedback">Conectando…</div>
            </div>
        </div>

        <div id="invalid-screen" style="display:none; flex-direction:column; align-items:center; gap:1rem; text-align:center;">
            <h1>Código no válido</h1>
            <p style="color: var(--text-dim);"></p>
        </div>
    </div>

    <script src="scripts/util.js"></script>
    <script src="scripts/browser-tabs-connector.js"></script>
    <script src="scripts/persistent-storage.js"></script>
    <script src="scripts/localization.js"></script>
    <script src="scripts/network.js"></script>
    <script src="scripts/app-send.js"></script>
</body>
</html>
